<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b5e"/><stop offset="1" stop-color="#e5362b"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcf5c"/><stop offset="1" stop-color="#f5a30f"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fe38a"/><stop offset="1" stop-color="#23b85a"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2a2e"/><stop offset="1" stop-color="#0c0c0e"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="38"/></filter>
  </defs>
  <!-- AMOLED tile -->
  <rect width="1024" height="1024" rx="228" fill="#000"/>
  <rect x="3" y="3" width="1018" height="1018" rx="225" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <!-- glows -->
  <g filter="url(#glow)" opacity="0.55">
    <rect x="92" y="497" width="270" height="270" rx="66" fill="#e5362b"/>
    <rect x="392" y="377" width="270" height="270" rx="66" fill="#f5a30f"/>
    <rect x="692" y="257" width="270" height="270" rx="66" fill="#23b85a"/>
  </g>
  <!-- keys: weak -> strong, climbing -->
  <rect x="92" y="497" width="270" height="270" rx="66" fill="url(#red)"/>
  <rect x="392" y="377" width="270" height="270" rx="66" fill="url(#amber)"/>
  <rect x="692" y="257" width="270" height="270" rx="66" fill="url(#green)"/>
  <!-- top-face highlights -->
  <g fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="6">
    <rect x="106" y="511" width="242" height="242" rx="54"/>
    <rect x="406" y="391" width="242" height="242" rx="54"/>
    <rect x="706" y="271" width="242" height="242" rx="54"/>
  </g>
</svg>
